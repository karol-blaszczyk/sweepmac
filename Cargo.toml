[package]
name = "sweepmac"
version = "0.1.0"
edition = "2021"
description = "Tiny macOS cleanup helper — finds and clears regenerable caches safely."
license = "MIT"
repository = "https://github.com/karol-blaszczyk/sweepmac"
keywords = ["macos", "cache", "cleanup", "disk-space"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "sweepmac"
path = "src/lib.rs"

[[bin]]
name = "sweepmac"
path = "src/main.rs"

[[bin]]
name = "sweepmac-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[[bin]]
name = "sweepmac-tray"
path = "src/bin/tray.rs"
required-features = ["tray"]

[[bin]]
name = "sweepmac-iconfile"
path = "src/bin/iconfile.rs"
required-features = ["pkg"]

[features]
# The CLI has zero dependencies. The GUI and menu-bar tray are opt-in via these
# features so a plain `cargo build` / `cargo install` stays tiny and fast.
# `pkg` is only used by the packaging script to emit the .icns source PNG.
gui = ["dep:eframe", "icons"]
tray = ["dep:tray-icon", "dep:tao", "icons"]
pkg = ["icons"]
# Internal: PNG decode/encode for the bundled icon assets. Not meant to be
# enabled on its own — `gui`, `tray` and `pkg` pull it in as needed.
icons = ["dep:png"]

[dependencies]
eframe = { version = "0.29", optional = true }
tao = { version = "0.35.3", optional = true }
tray-icon = { version = "0.24.0", optional = true }
png = { version = "0.17", optional = true }

[profile.release]
opt-level = "z"
lto = true
strip = true
