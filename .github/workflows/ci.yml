name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build all binaries
        run: cargo build --release --features "gui tray pkg"
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --features "gui tray pkg" -- -D warnings
