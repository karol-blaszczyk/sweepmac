name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build all binaries
        run: cargo build --release --features "gui tray pkg"
      - name: Tests
        run: cargo test --features "gui tray pkg"
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --features "gui tray pkg" -- -D warnings

  cask:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Audit the Homebrew cask
        run: |
          set -euo pipefail
          brew style Casks/sweepmac.rb
          # `brew audit` only takes a token, never a path, so the checkout has
          # to stand in as the tap — auditing the published tap would check
          # main rather than the commit under test.
          TAP="$(brew --repository)/Library/Taps/karol-blaszczyk/homebrew-sweepmac"
          mkdir -p "$(dirname "$TAP")"
          cp -R "$GITHUB_WORKSPACE" "$TAP"
          brew audit --cask --strict karol-blaszczyk/sweepmac/sweepmac
